<!DOCTYPE html>
<html>
<head>
    <title>IT Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            background:#0b1220;
            color:white;
            font-family:Arial;
            padding:20px;
        }

        .popup {
            position:fixed;
            top:20px;
            right:20px;
            background:#1e293b;
            padding:15px;
            border-left:5px solid lime;
            border-radius:8px;
            display:none;
            z-index:999;
        }

        input {
            padding:8px;
            margin:3px;
        }

        form {
            background:#111827;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
        }

        button {
            cursor:pointer;
        }

        /* 📜 SCROLLABLE TICKET AREA */
        #list {
            max-height:700px;
            overflow-y:auto;
            padding-right:5px;
        }

        #list::-webkit-scrollbar {
            width:8px;
        }

        #list::-webkit-scrollbar-thumb {
            background:#334155;
            border-radius:10px;
        }
    </style>
</head>

<body>

<button onclick="logout()" style="
float:right;
padding:8px;
background:red;
color:white;
border:none;
border-radius:6px;
">
LOGOUT
</button>

<h1>🖥 JOMAR</h1>

<!-- 📤 CREATE TICKET -->
<h3>📤 Create Ticket</h3>

<form id="ticketForm">
    <input name="seat" placeholder="Seat No" required>
    <input name="issue" placeholder="Issue" required>
    <input name="userMessage" placeholder="Message" required>
    <input name="priority" placeholder="Priority (Low/High/Emergency)" required>

    <input type="file" name="file">

    <button type="submit"
    style="
    background:green;
    color:white;
    border:none;
    border-radius:6px;
    padding:10px;
    ">
    Send Ticket
    </button>
</form>

<!-- 📋 TICKET LIST -->
<div id="list"></div>

<hr>

<h3>⚙️ Change Account</h3>

<input id="newUser" placeholder="New Username"><br>

<input id="newPass"
placeholder="New Password"
type="password"><br>

<button onclick="updateAccount()"
style="
padding:8px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
">
Save Changes
</button>

<div id="popup" class="popup"></div>

<audio id="beep"
src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

// 🔐 LOGIN CHECK
if (localStorage.getItem("it_login") !== "true") {
    window.location.href = "/login.html";
}

function logout() {
    localStorage.removeItem("it_login");
    window.location.href = "/login.html";
}

// DEFAULT ACCOUNT
if (!localStorage.getItem("it_user")) {
    localStorage.setItem("it_user", "admin");
    localStorage.setItem("it_pass", "1234");
}

function updateAccount() {

    const u = document.getElementById("newUser").value;
    const p = document.getElementById("newPass").value;

    if (u.length < 3 || p.length < 3) {
        alert("Too short!");
        return;
    }

    localStorage.setItem("it_user", u);
    localStorage.setItem("it_pass", p);

    alert("Updated! Please login again.");

    localStorage.removeItem("it_login");
    window.location.href = "/login.html";
}

// 📡 SOCKET
const socket = io();

const list = document.getElementById("list");
const popup = document.getElementById("popup");
const beep = document.getElementById("beep");

// 🔔 POPUP
function showPopup(text) {

    popup.innerText = text;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 3000);
}

// 🔊 SOUND
function playBeep() {

    beep.currentTime = 0;

    beep.play().catch(()=>{});
}

// 📤 CREATE TICKET WITH FILE
document.getElementById("ticketForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const formData = new FormData(e.target);

    await fetch("/upload", {
        method: "POST",
        body: formData
    });

    e.target.reset();

    alert("Ticket Sent!");
});

// 📥 RECEIVE TICKETS
socket.on("update", (tickets) => {

    list.innerHTML = "";

    if (tickets.length > 0) {

        const last = tickets[tickets.length - 1];

        showPopup("New Ticket: " + last.ticketNo);

        playBeep();
    }

    tickets.reverse().forEach(t => {

        let color = "green";

        if (t.priority === "High") color = "orange";

        if (t.priority === "Emergency") color = "red";

        const div = document.createElement("div");

        // 📦 SMALLER BOX
        div.style.cssText = `
            background:#1e293b;
            margin:6px auto;
            padding:10px;
            border-left:4px solid ${color};
            border-radius:8px;
            font-size:13px;
            width:85%;
        `;

        div.innerHTML = `

            <h3 style="margin:0 0 5px 0;">
                ${t.ticketNo || ("TICKET #" + t.id)}
            </h3>

            <p><b>Seat:</b> ${t.seat}</p>

            <p><b>Issue:</b> ${t.issue}</p>

            <div style="
                background:#0f172a;
                padding:8px;
                margin:8px 0;
                border-left:4px solid yellow;
                color:#facc15;
                font-weight:bold;
                border-radius:6px;
            ">
                📝 ${t.userMessage}
            </div>

            ${t.file ? `
                <p>
                📎 Attachment:
                <a href="${t.file}"
                target="_blank"
                style="color:cyan;">
                View File
                </a>
                </p>
            ` : ""}

            <p><b>Date:</b> ${t.date || "-"}</p>

            <p><b>Time:</b> ${t.time || "-"}</p>

            <p><b>Priority:</b> ${t.priority}</p>

            <p><b>Status:</b> ${t.status}</p>

            <div style="margin-top:10px;">

                ${
                    t.status !== "Resolved"

                    ? `
                    <button onclick="resolve(${t.id})"
                    style="
                        padding:6px 10px;
                        background:green;
                        color:white;
                        border:none;
                        border-radius:6px;
                        margin-right:5px;
                    ">
                    RESOLVE
                    </button>
                    `

                    : ""
                }

                <button onclick="removeTicket(${t.id})"
                style="
                    padding:6px 10px;
                    background:red;
                    color:white;
                    border:none;
                    border-radius:6px;
                ">
                DELETE
                </button>

            </div>
        `;

        list.appendChild(div);
    });
});

// ✅ RESOLVE
function resolve(id) {
    socket.emit("resolve", id);
}

// 🗑 DELETE
function removeTicket(id) {

    if(confirm("Delete this ticket?")) {

        socket.emit("delete-ticket", id);
    }
}

</script>

</body>
</html>
